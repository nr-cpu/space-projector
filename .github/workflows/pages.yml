name: Deploy display preview to GitHub Pages

# Builds only the web/display client as a static preview. Stars, planets,
# Milky Way, satellites, and comets all render from data embedded in the
# bundle at build time (see shared/scripts/build-*.mjs), so the sky is real
# even with no backend. What's missing without the real Node server: live
# radio/API aircraft tracking, always-fresh satellite/comet data, and config
# persistence (see README: pnpm install && pnpm dev for the real thing).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web (Pages base path)
        run: pnpm -F web build
        env:
          PAGES_BASE: /space-projector/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
